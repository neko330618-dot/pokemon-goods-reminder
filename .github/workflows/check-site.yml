
name: Pokemon goods daily update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Pokemon goods
        run: python scripts/update_products.py
        
      - name: Update Pokemon card news
        run: python scripts/update_card_news.py

      - name: Save updated product data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Pokemon goods"
            git push
          else
            echo "No changes to save"
          fi
